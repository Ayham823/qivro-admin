name: Admin CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20.19"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - name: Admin session and review API contracts
        run: node --test scripts/admin-contracts.test.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://backend:3001/api
          NEXT_PUBLIC_BROWSER_API_URL: https://api.qivro.io/api
