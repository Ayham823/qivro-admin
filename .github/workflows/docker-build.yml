name: Build Admin Docker Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate image build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:3001/api
            NEXT_PUBLIC_BROWSER_API_URL=${{ vars.ADMIN_BROWSER_API_URL || 'https://api.qivro.io/api' }}
            NEXT_PUBLIC_GITHUB_URL=${{ vars.ADMIN_GITHUB_URL }}
            NEXT_PUBLIC_GA4_URL=${{ vars.ADMIN_GA4_URL }}
            NEXT_PUBLIC_POSTHOG_URL=${{ vars.ADMIN_POSTHOG_URL }}
            NEXT_PUBLIC_SENTRY_URL=${{ vars.ADMIN_SENTRY_URL }}
            NEXT_PUBLIC_GRAFANA_URL=${{ vars.ADMIN_GRAFANA_URL }}
            NEXT_PUBLIC_CLOUDWATCH_URL=${{ vars.ADMIN_CLOUDWATCH_URL }}
            NEXT_PUBLIC_AWS_CONSOLE_URL=${{ vars.ADMIN_AWS_CONSOLE_URL }}
            NEXT_PUBLIC_STRIPE_URL=${{ vars.ADMIN_STRIPE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.ADMIN_SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ vars.DEPLOY_ENVIRONMENT || 'ci' }}
            SENTRY_TRACES_SAMPLE_RATE=0.1
          tags: qivro-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log in to Docker Hub
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != '' }}
        uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Publish image
        if: ${{ env.DOCKER_USERNAME != '' && env.DOCKER_TOKEN != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=http://backend:3001/api
            NEXT_PUBLIC_BROWSER_API_URL=${{ vars.ADMIN_BROWSER_API_URL || 'https://api.qivro.io/api' }}
            NEXT_PUBLIC_GITHUB_URL=${{ vars.ADMIN_GITHUB_URL }}
            NEXT_PUBLIC_GA4_URL=${{ vars.ADMIN_GA4_URL }}
            NEXT_PUBLIC_POSTHOG_URL=${{ vars.ADMIN_POSTHOG_URL }}
            NEXT_PUBLIC_SENTRY_URL=${{ vars.ADMIN_SENTRY_URL }}
            NEXT_PUBLIC_GRAFANA_URL=${{ vars.ADMIN_GRAFANA_URL }}
            NEXT_PUBLIC_CLOUDWATCH_URL=${{ vars.ADMIN_CLOUDWATCH_URL }}
            NEXT_PUBLIC_AWS_CONSOLE_URL=${{ vars.ADMIN_AWS_CONSOLE_URL }}
            NEXT_PUBLIC_STRIPE_URL=${{ vars.ADMIN_STRIPE_URL }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.ADMIN_SENTRY_DSN }}
            SENTRY_ENVIRONMENT=${{ vars.DEPLOY_ENVIRONMENT || 'production' }}
            SENTRY_TRACES_SAMPLE_RATE=0.1
          tags: ${{ env.DOCKER_USERNAME }}/qivro-admin:${{ github.sha }}
          cache-from: type=gha
